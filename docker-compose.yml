version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: warehouse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-warehouse_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-warehouse_password}
      POSTGRES_DB: ${DB_NAME:-warehouse_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - warehouse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-warehouse_user} -d ${DB_NAME:-warehouse_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    image: docker.io/tmshuu/warehouse-service:latest
    container_name: warehouse-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-warehouse_user}:${DB_PASSWORD:-warehouse_password}@postgres:5432/${DB_NAME:-warehouse_db}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      # E-Barimt Configuration
      EBARIMT_ENABLED: ${EBARIMT_ENABLED:-true}
      EBARIMT_API_URL: ${EBARIMT_API_URL:-http://host.docker.internal:7080}
      EBARIMT_MERCHANT_TIN: ${EBARIMT_MERCHANT_TIN:-37900846788}
      EBARIMT_POS_NO: ${EBARIMT_POS_NO:-10014457}
      EBARIMT_BRANCH_NO: ${EBARIMT_BRANCH_NO:-1}
      EBARIMT_DISTRICT_CODE: ${EBARIMT_DISTRICT_CODE:-2506}
      # Prisma configuration
      PRISMA_CLI_QUERY_ENGINE_TYPE: binary
      PRISMA_CLIENT_ENGINE_TYPE: binary
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - warehouse-network
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    image: docker.io/tmshuu/warehouse-web:latest
    container_name: warehouse-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://backend:3000
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - warehouse-network

volumes:
  postgres_data:
    driver: local

networks:
  warehouse-network:
    driver: bridge
